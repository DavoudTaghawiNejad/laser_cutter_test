# G-code dictionary for writing digits 0..9 in RELATIVE coordinates.
# Set G91 (relative positioning) once at the program level before
# invoking these snippets.
#
# Per-digit contract:
#   - Entry: pen sits at the BOTTOM-LEFT corner of the digit, (0, 0).
#   - Exit : pen finishes at (+1.2, 0) -- the BOTTOM-RIGHT corner of
#            the digit, with no inter-digit gap added. To space
#            digits apart, insert a `G0 X<gap>` between snippets.
#
# Shape conventions (in local coords, origin = entry point):
#   - Body: X = 0 .. 1.2, Y = 0.425 .. 2.975  (1.2 mm wide, 2.55 mm tall ink,
#                                              with 0.425 mm top/bottom margin)
#   - All digits LEFT-aligned. "1" has its vertical stroke at X = 0.9
#     so its baseline foot ends at X = 1.2, matching the other digits.
#
# Scaled from the original 2.0 x 3.5 mm cell:
#   X scaled by 0.60  (40% narrower)
#   Y scaled by 0.85  (15% shorter)
#   The decimaldot is intentionally NOT scaled.
#
# Laser convention:
#   M4 S{power} = laser on  (replace {power}, e.g. 255)
#   M5          = laser off
#   F1000       = drawing feedrate


letter_width: 1.2
letter_height: 3
distance_between_letters: 0.2
distance_between_numbers: 0.7


n0: |
  M5
  G0 Y0.425
  M4 S{power}
  G1 Y2.55 F1000
  G1 X1.2
  G1 Y-2.55
  G1 X-1.2
  M5
  G0 X1.2 Y-0.425

n1: |
  M5
  G0 X0.6 Y2.55
  M4 S{power}
  G1 X0.3 Y0.425 F1000
  G1 Y-2.55
  M5
  G0 X-0.3
  M4 S{power}
  G1 X0.6 F1000
  M5
  G0 Y-0.425

n2: |
  M5
  G0 Y2.975
  M4 S{power}
  G1 X1.2 F1000
  G1 Y-1.275
  G1 X-1.2
  G1 Y-1.275
  G1 X1.2
  M5
  G0 Y-0.425

n3: |
  M5
  G0 Y2.975
  M4 S{power}
  G1 X1.2 F1000
  G1 Y-2.55
  G1 X-1.2
  M5
  G0 Y1.275
  M4 S{power}
  G1 X1.2 F1000
  M5
  G0 Y-1.7

n4: |
  M5
  G0 Y2.975
  M4 S{power}
  G1 Y-1.275 F1000
  G1 X1.2
  M5
  G0 Y1.275
  M4 S{power}
  G1 Y-2.55 F1000
  M5
  G0 Y-0.425

n5: |
  M5
  G0 X1.2 Y2.975
  M4 S{power}
  G1 X-1.2 F1000
  G1 Y-1.275
  G1 X1.2
  G1 Y-1.275
  G1 X-1.2
  M5
  G0 X1.2 Y-0.425

n6: |
  M5
  G0 X1.2 Y2.975
  M4 S{power}
  G1 X-1.2 F1000
  G1 Y-2.55
  G1 X1.2
  G1 Y1.275
  G1 X-1.2
  M5
  G0 X1.2 Y-1.7

n7: |
  M5
  G0 Y2.975
  M4 S{power}
  G1 X1.2 F1000
  G1 Y-2.55
  M5
  G0 Y-0.425

n8: |
  M5
  G0 Y0.425
  M4 S{power}
  G1 Y2.55 F1000
  G1 X1.2
  G1 Y-2.55
  G1 X-1.2
  M5
  G0 Y1.275
  M4 S{power}
  G1 X1.2 F1000
  M5
  G0 Y-1.7

n9: |
  M5
  G0 Y1.7
  M4 S{power}
  G1 Y1.275 F1000
  G1 X1.2
  G1 Y-2.55
  G1 X-1.2
  M5
  G0 Y1.275
  M4 S{power}
  G1 X1.2 F1000
  M5
  G0 Y-1.7

dash: |
  M5
  G0 Y1.7
  M4 S{power}
  G1 X0.3 F{speed}
  M5
  G0 Y-1.7

d: |  # go down
  M5
  G0 X-1.5 Y-3.0  ; dow one line down and a letter plus a space left

space: |
  M5         ; laser off (defensive, in case previous block left it on)
  G0 X{space}      ; advance by parameter, no draw

spacebar: |
  M5         ; laser off (defensive, in case previous block left it on)
  G0 X1.2    ; advance one letter-width to the right, no draw

decimaldot: |
    M5
    G0 X0 Y0.35       ; travel to bottom-left corner of the dot
    M4 S{power}
    G1 X0.1 F{speed}  ; bottom edge
    G1 Y0.3 F{speed}  ; right edge
    G1 X-0.1 F{speed} ; top edge
    G1 Y-0.3 F{speed} ; left edge (closes the square)
    M5
    G0 X0.1 Y-0.35 F{speed}
