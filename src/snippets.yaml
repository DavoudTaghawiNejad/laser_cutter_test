
start: |
    G21 ; Set units to millimeters
    G90 ; Absolute positioning
    M8  ; Turn on air assist / coolant
    T0

end: |
    M9                  ; Turn off air assist / coolant
    M5                  ; Ensure laser is off
    G10 L2 P1 X0 Y0
    G0 X0 Y0            ; Return to origin


move_origin_x: |
    G92 X{mm}           ; move x positon of origin


move_origin_y: |
    G92 Y{mm}           ; move y positon of origin

set_origin: |
    ; set_origin
    ; ==========
    M5
    G10 L2 P1 X{x} Y{y}
    G54
    G90
    G0 X0 Y0

fence_mark: |
    ; mark fence
    ; ==========
    G0 X0 Y0
    G1 X0 Y{height} F1000
    G1 X{width} Y{height}
    G1 X{width} Y0
    G1 X0 Y0
