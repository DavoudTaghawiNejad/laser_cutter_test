
start: |
    $X
    $RST=*
    $H
    $32=1
    G4 P0.5
    G21 ; Set units to millimeters
    G90 ; Absolute positioning
    M8  ; Turn on air assist / coolant
    T0


end: |
    M9                  ; Turn off air assist / coolant
    M5                  ; Ensure laser is off
    G10 L2 P1 X0 Y0
    G0 X0 Y0            ; Return to origin

set_origin: |
    ; set_origin
    ; ==========
    M5
    G90
    G10 L2 P1 X{x} Y{y}
    G54
    G0 X0 Y0

fence: |
    M5
    G0 X0 Y0 F{speed}    ; mark fence
    G0 X{x} Y0 F{speed}    ; mark fence
    G0 X{x} Y{y} F{speed}    ; mark fence
    G0 X0 Y{y} F{speed}    ; mark fence
    G0 X0 Y0 F{speed}    ; mark fence

info: |
    $I
    $$
    ?
