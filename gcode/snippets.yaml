
start: |
    G92 X0 Y0
    G21 ; Set units to millimeters
    G90 ; Absolute positioning
    G54
    M8  ; Turn on air assist / coolant
    T0

end: |
  M9                  ; Turn off air assist / coolant
  M5                  ; Ensure laser is off
  G0 X0 Y0            ; Return to origin


move_origin_x: |
    G92 X{mm}


move_origin_y: |
    G92 Y{mm}

line_mm_right: |
    M4 S{power}
    G1 X{mm} Y0 F{speed}
    M5

set_origin: |
    G92.1            ; reset G92 offset
    G0 X0 Y0
    G92 X-{x} Y-{y}

undo_set_origin: |
    G92.1
    G0 X0 Y0
    G92 X{x} Y{y}


